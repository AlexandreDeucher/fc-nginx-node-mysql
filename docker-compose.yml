services:
  app:
    build:
      context: ./node
    container_name: node_app
    tty: true
    volumes:
      - ./node:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - node_network
    depends_on:
      - db


  nginx:
    build:
      context: ./nginx
    container_name: nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    networks:
      - node_network

  db:
    image: mysql:5.7
    command: --innodb-use-native-aio=0
    container_name: db
    restart: always
    tty: true
    volumes:
      - ./mysql:/var/lib/mysql
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_DATABASE=nodedb
      - MYSQL_ROOT_PASSWORD=root=root
    networks:
      - node_network

networks:
  node_network:
    driver: bridge
